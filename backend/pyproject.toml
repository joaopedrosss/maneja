[project]
name = "maneja"
version = "0.1.0"
description = "Backend do Maneja: agente de manejo, coleiras e planejado x realizado"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "pytest-bdd>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maneja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"
filterwarnings = ["ignore:Using `httpx`"]
